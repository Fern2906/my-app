<h1>Directorio ({{ userCount() }} usuarios)</h1>

<app-controls (sortByName)="sortByName()" (sortById)="sortById()" (reverse)="reverse()" />

<div class="container flex flex-row flex-wrap justify-center"> 
    @for (user of users(); track user.id) {
        <app-user-card [user]="user" (deleteUser)="removeUser($event)" />
    } @empty {
        <p class="empty-message">No hay usuarios en el directorio</p>
    }
</div>
